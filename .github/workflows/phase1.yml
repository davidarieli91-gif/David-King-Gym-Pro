name: Phase 1 — PWA fixes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate PWA icons from logo
        run: |
          if command -v magick >/dev/null 2>&1; then IM=magick; else IM=convert; fi
          SRC=icons/icon1.png
          [ -f "$SRC" ] || SRC=$(ls icons/*.png 2>/dev/null | head -1)
          if [ -n "$SRC" ]; then
            $IM "$SRC" -resize 512x512^ -gravity center -extent 512x512 icon-512.png
            $IM "$SRC" -resize 192x192^ -gravity center -extent 192x192 icon-192.png
            ls -la icon-*.png
          else
            echo "No source icon found, skipping"
          fi

      - name: Write manifest.json
        run: |
          cat > manifest.json <<'MANIFEST_EOF'
          {
            "name": "David King Gym",
            "short_name": "DK Gym",
            "description": "Fitness CRM — clients, training programs, nutrition, Private Gym form printing",
            "id": "./",
            "start_url": "./fitness-crm.html",
            "scope": "./",
            "display": "standalone",
            "orientation": "any",
            "background_color": "#0f172a",
            "theme_color": "#10b981",
            "lang": "ru",
            "dir": "ltr",
            "categories": ["health", "fitness", "productivity"],
            "icons": [
              { "src": "icon-192.png", "sizes": "192x192", "type": "image/png", "purpose": "any" },
              { "src": "icon-512.png", "sizes": "512x512", "type": "image/png", "purpose": "any" },
              { "src": "icon-512.png", "sizes": "512x512", "type": "image/png", "purpose": "maskable" }
            ]
          }
          MANIFEST_EOF

      - name: Write sw.js (v6)
        run: |
          cat > sw.js <<'SW_EOF'
          const CACHE_NAME = 'dk-gym-v6';
          const APP_SHELL = [
            './',
            './fitness-crm.html',
            './exercise-db.json',
            './food-db.json',
            './manifest.json',
            './icon-192.png',
            './icon-512.png'
          ];
          self.addEventListener('install', (e) => {
            e.waitUntil(
              caches.open(CACHE_NAME).then((c) => c.addAll(APP_SHELL)).then(() => self.skipWaiting())
            );
          });
          self.addEventListener('activate', (e) => {
            e.waitUntil(
              caches.keys()
                .then((keys) => Promise.all(keys.filter((k) => k !== CACHE_NAME).map((k) => caches.delete(k))))
                .then(() => self.clients.claim())
            );
          });
          self.addEventListener('message', (e) => {
            if (e.data === 'SKIP_WAITING') self.skipWaiting();
          });
          self.addEventListener('fetch', (e) => {
            const req = e.request;
            if (req.method !== 'GET') return;
            const url = new URL(req.url);
            if (req.mode === 'navigate') {
              e.respondWith(
                fetch(req)
                  .then((res) => {
                    const copy = res.clone();
                    caches.open(CACHE_NAME).then((c) => c.put(req, copy));
                    return res;
                  })
                  .catch(() => caches.match(req).then((r) => r || caches.match('./fitness-crm.html')))
              );
              return;
            }
            if (url.origin === self.location.origin) {
              e.respondWith(
                caches.match(req).then((cached) => {
                  if (cached) return cached;
                  return fetch(req).then((res) => {
                    const copy = res.clone();
                    caches.open(CACHE_NAME).then((c) => c.put(req, copy));
                    return res;
                  });
                }).catch(() => new Response('Offline', { status: 503 }))
              );
              return;
            }
            e.respondWith(
              fetch(req)
                .then((res) => {
                  const copy = res.clone();
                  caches.open(CACHE_NAME).then((c) => c.put(req, copy));
                  return res;
                })
                .catch(() => caches.match(req).then((r) => r || new Response('Offline', { status: 503 })))
            );
          });
          SW_EOF

      - name: Write README.md
        run: |
          cat > README.md <<'README_EOF'
          # Qwen_And_David_Fitness_OS — DEVELOPMENT
          Рабочая (production) версия: david-king-gym.
          Здесь тестируются изменения перед переносом в production.
          Изменения вносятся через GitHub Actions (workflows в .github/workflows).
          README_EOF

      - name: Cosmetic fix (reseed label)
        run: |
          sed -i 's/Re-seed exercise database (9 base exercises)/Re-seed exercise database (1,660 exercises)/' fitness-crm.html || true

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Phase 1: PWA icons + manifest fix + sw v6 + README"
          git push
