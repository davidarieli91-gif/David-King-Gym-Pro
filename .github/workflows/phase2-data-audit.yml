name: Run Data Audit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run audit
        run: node scripts/normalize.js
      - name: Commit and push
        run: git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com" && git add -A && (git diff --cached --quiet || git commit -m "Phase 2 data audit reports CSV normalized JSON") && git push
