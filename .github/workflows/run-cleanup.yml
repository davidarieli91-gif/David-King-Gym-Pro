name: Run Data Cleanup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fix reseed label
        run: sed -i 's/Re-seed exercise database (9 base exercises)/Re-seed exercise database (1,660 exercises)/' fitness-crm.html
      - name: Run cleanup
        run: node scripts/cleanup.js
      - name: Commit and push
        run: git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com" && git add -A && (git diff --cached --quiet || git commit -m "Phase 3 data cleanup + reseed label fix") && git push
