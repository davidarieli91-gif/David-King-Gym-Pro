name: Run Cleanup 2 Images and XRay

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run cleanup2
        run: node scripts/cleanup2.js
      - name: Bump SW cache to v7
        run: sed -i "s/dk-gym-v6/dk-gym-v7/" sw.js
      - name: Commit and push
        run: git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com" && git add -A && (git diff --cached --quiet || git commit -m "Phase 4 remove pg mm images delete orphans xray sw v7") && git push
