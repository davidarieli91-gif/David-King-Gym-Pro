name: Run Cleanup 4 Form Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run cleanup4
        run: node scripts/cleanup4.js
      - name: Bump SW cache to v9
        run: sed -i "s/dk-gym-v8/dk-gym-v9/" sw.js
      - name: Commit and push
        run: git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com" && git add -A && (git diff --cached --quiet || git commit -m "Phase 4 fix client form compat fields remove generate buttons AI panel generator modal") && git push
