name: Run Cleanup 5 Generate Buttons

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run cleanup5
        run: node scripts/cleanup5.js
      - name: Bump SW cache to v10
        run: sed -i "s/dk-gym-v9/dk-gym-v10/" sw.js
      - name: Commit and push
        run: git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com" && git add -A && (git diff --cached --quiet || git commit -m "Phase 4 final remove profile generate buttons") && git push
