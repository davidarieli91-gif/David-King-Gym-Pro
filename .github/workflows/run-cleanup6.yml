name: Run Cleanup 6 Runtime Removal

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run cleanup6
        run: node scripts/cleanup6.js
      - name: Bump SW cache to v11
        run: sed -i "s/dk-gym-v10/dk-gym-v11/" sw.js
      - name: Commit and push
        run: git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com" && git add -A && (git diff --cached --quiet || git commit -m "Phase 4 final runtime removal generate-program button training card") && git push
