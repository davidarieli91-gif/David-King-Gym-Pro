name: Run Cleanup 7 Final

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run cleanup7
        run: node scripts/cleanup7.js
      - name: Bump SW cache
        run: sed -i "s/dk-gym-v11/dk-gym-v12/" sw.js || sed -i "s/dk-gym-v10/dk-gym-v12/" sw.js || sed -i "s/dk-gym-v9/dk-gym-v12/" sw.js
      - name: Commit and push
        run: git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com" && git add -A && (git diff --cached --quiet || git commit -m "Phase 4 final runtime cleanup v2 questionnaire safety net name translations") && git push
