name: Run Phase 5.1 Data Polish

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  phase51:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run phase 5.1
        run: node scripts/phase5-1.js
      - name: Bump SW cache
        run: sed -i "s/dk-gym-v12/dk-gym-v13/" sw.js || sed -i "s/dk-gym-v11/dk-gym-v13/" sw.js || sed -i "s/dk-gym-v10/dk-gym-v13/" sw.js
      - name: Commit and push
        run: git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com" && git add -A && (git diff --cached --quiet || git commit -m "Phase 5.1 exercise dedup translations backup reminder version stamp") && git push
