name: Run Phase 5.2 Image Mapping

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  phase52:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run phase 5.2
        run: node scripts/phase5-2.js
      - name: Bump SW cache
        run: sed -i "s/dk-gym-v13/dk-gym-v14/" sw.js || sed -i "s/dk-gym-v12/dk-gym-v14/" sw.js
      - name: Commit and push
        run: git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com" && git add -A && (git diff --cached --quiet || git commit -m "Phase 5.2 map burnfit animations to pg mm exercises") && git push
