name: Run Phase 5.4 Progress Report

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  phase54:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run phase 5.4
        run: node scripts/phase5-4.js
      - name: Bump SW cache
        run: sed -i "s/dk-gym-v15/dk-gym-v16/" sw.js || sed -i "s/dk-gym-v14/dk-gym-v16/" sw.js
      - name: Commit and push
        run: git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com" && git add -A && (git diff --cached --quiet || git commit -m "Phase 5.4 client progress report with WhatsApp share") && git push
