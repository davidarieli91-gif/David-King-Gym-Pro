<!DOCTYPE html>
<html lang="ru" dir="ltr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0f" />
  <meta name="description" content="David King Gym — Персональный кабинет подопечного" />
  <title>David King Gym — Мой Портал</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icon-512.png" />
  <link rel="apple-touch-icon" href="icon-512.png" />
  <link rel="stylesheet" href="src/input.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-sans: 'Inter', system-ui, sans-serif;
      --font-display: 'Plus Jakarta Sans', Inter, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; }
    body {
      font-family: var(--font-sans);
      background: #0a0a0f;
      color: #f1f5f9;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      min-height: 100dvh;
      padding-top: var(--sat);
      padding-bottom: var(--sab);
    }
    .glass { background: rgba(20,20,30,.72); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border: 1px solid rgba(255,255,255,.07); }
    .glass-strong { background: rgba(20,20,30,.9); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,.1); }
    .font-display { font-family: var(--font-display); }
    .font-mono { font-family: var(--font-mono); }
    .no-sb::-webkit-scrollbar { display: none; }
    .no-sb { -ms-overflow-style: none; scrollbar-width: none; }
    [dir="rtl"] .flip-rtl { transform: scaleX(-1); }
    .flip-rtl { transform: scaleX(1); }
    @keyframes fade-slide { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .fade-in { animation: fade-slide .3s ease both; }
    @keyframes pulse-ring { 0%,100% { box-shadow:0 0 0 0 rgba(99,102,241,.4); } 50% { box-shadow:0 0 0 8px rgba(99,102,241,0); } }
    .pulse-ring { animation: pulse-ring 2s ease-in-out infinite; }
    .prog-bar { height: 6px; border-radius: 999px; background: rgba(255,255,255,.06); overflow: hidden; }
    .prog-bar-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #6366f1, #06b6d4); transition: width .5s cubic-bezier(.4,0,.2,1); }
    .ex-img { aspect-ratio: 4/3; object-fit: cover; border-radius: 12px; width: 100%; background: #14141e; }
    .set-row-done { opacity: .45; }
    .set-row-done .set-check { background: #10b981 !important; border-color: #10b981 !important; color: #fff !important; }
    .tab-btn { transition: all .2s cubic-bezier(.4,0,.2,1); }
    .tab-btn.active { color: #818cf8; }
    .tab-btn.active .tab-icon { stroke: #818cf8; }
    .tab-btn.active .tab-label { font-weight: 700; }
    .nutri-check:checked + .meal-label { opacity: .45; text-decoration: line-through; }
    .macro-ring { transition: stroke-dashoffset .8s cubic-bezier(.4,0,.2,1); }
    #unlock-screen { z-index: 100; }
  </style>
</head>
<body class="flex flex-col">

  <!-- ============= HEADER ============= -->
  <header class="sticky top-0 z-40 glass-strong px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-cyan-400 grid place-items-center font-display font-extrabold text-white text-base shadow-lg shadow-indigo-500/20">DK</div>
      <div>
        <h1 id="hdr-name" class="font-display font-bold text-sm leading-tight truncate max-w-[160px]">Мой Портал</h1>
        <p id="hdr-goal" class="text-[11px] text-slate-400 truncate max-w-[160px]">David King Gym</p>
      </div>
    </div>
    <div class="flex items-center gap-1.5">
      <select id="lang-select" class="bg-slate-800/80 border border-slate-700 text-xs rounded-lg px-2 py-1.5 text-slate-200 outline-none cursor-pointer">
        <option value="ru">RU</option><option value="en">EN</option><option value="he">HE</option>
      </select>
      <button id="btn-share-report" class="bg-indigo-500/15 hover:bg-indigo-500/25 text-indigo-300 border border-indigo-500/25 rounded-lg p-2 transition" title="Share">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
      </button>
    </div>
  </header>

  <!-- ============= UNLOCK SCREEN ============= -->
  <div id="unlock-screen" class="hidden fixed inset-0 z-[100] bg-black/90 backdrop-blur-lg flex items-center justify-center p-4">
    <div class="glass-strong rounded-3xl p-6 max-w-xs w-full text-center space-y-4">
      <div class="w-14 h-14 mx-auto rounded-2xl bg-gradient-to-tr from-indigo-500 to-cyan-400 grid place-items-center text-2xl shadow-lg shadow-indigo-500/30">🔒</div>
      <div>
        <h2 class="font-display font-bold text-base text-white" id="txt-unlock-title">Введите код доступа</h2>
        <p class="text-xs text-slate-400 mt-1" id="txt-unlock-subtitle">Код прислал тренер вместе со ссылкой</p>
      </div>
      <input type="tel" inputmode="numeric" maxlength="6" id="unlock-code-input" placeholder="••••••" autocomplete="off"
        class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-3 text-center font-mono text-xl tracking-[0.4em] text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
      <p id="unlock-error" class="text-xs text-red-400 min-h-[1rem]"></p>
      <button id="btn-unlock" class="w-full bg-gradient-to-r from-indigo-500 to-cyan-400 text-white font-bold text-sm py-3 rounded-xl shadow-lg shadow-indigo-500/25 transition active:scale-95">Открыть портал</button>
    </div>
  </div>

  <!-- ============= MAIN ============= -->
  <main class="flex-1 max-w-lg mx-auto w-full px-4 pt-4 pb-28 space-y-4">

    <!-- Hero card -->
    <div id="client-card" class="glass rounded-2xl p-4 relative overflow-hidden fade-in">
      <div class="absolute inset-0 bg-gradient-to-br from-indigo-500/8 via-transparent to-cyan-400/5 pointer-events-none"></div>
      <div class="relative">
        <div class="flex items-center justify-between mb-2">
          <span class="text-[10px] font-semibold uppercase tracking-wider text-cyan-300 flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
            <span id="txt-active-program">План активен</span>
          </span>
        </div>
        <div class="flex items-end justify-between gap-3">
          <div class="min-w-0 flex-1">
            <div id="banner-prog-name" class="font-display font-extrabold text-lg text-white truncate">…</div>
            <div id="banner-prog-split" class="text-xs text-slate-400 mt-0.5">—</div>
          </div>
          <button id="btn-quick-start" class="bg-gradient-to-r from-indigo-500 to-cyan-400 text-white font-bold text-xs px-4 py-2.5 rounded-xl shadow-lg shadow-indigo-500/20 transition active:scale-95 flex items-center gap-1.5 shrink-0">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <span id="txt-start-btn">В зал</span>
          </button>
        </div>

        <div class="mt-3">

            <span id="txt-progress-pct">0%</span>
          </div>
          <div class="prog-bar"><div id="workout-progress" class="prog-bar-fill" style="width:0%"></div></div>
        </div>
      </div>
    </div>

    <!-- ===== TAB: WORKOUTS ===== -->
    <section id="tab-workouts" class="space-y-3 fade-in">
      <div id="days-tabs-container" class="flex items-center gap-1.5 overflow-x-auto no-sb pb-1"></div>
      <div id="workout-exercises-list" class="space-y-3"></div>
      <div id="workout-finish-box" class="pt-1">
        <button id="btn-finish-workout" class="w-full bg-emerald-500 hover:bg-emerald-400 text-white font-bold text-sm py-3.5 rounded-2xl shadow-xl shadow-emerald-500/20 transition active:scale-95 flex items-center justify-center gap-2">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
          <span id="txt-finish-workout">Завершить тренировку</span>
        </button>
      </div>
    </section>

    <!-- ===== TAB: NUTRITION ===== -->

      <div class="glass rounded-2xl p-4">
        <div class="flex justify-between items-center mb-3">
          <h3 class="font-display font-bold text-sm text-slate-200" id="txt-daily-targets">Суточная норма</h3>
          <span id="target-cal-badge" class="font-mono font-bold text-cyan-300 text-sm">—</span>
        </div>
        <div class="grid grid-cols-3 gap-2 text-center">
          <div class="bg-slate-800/60 rounded-xl p-2.5 border border-slate-700/50">
            <div class="text-[9px] text-slate-400 font-semibold uppercase">Белки</div>
            <div id="macro-p" class="font-mono font-extrabold text-sm text-indigo-300 mt-0.5">—</div>
          </div>
          <div class="bg-slate-800/60 rounded-xl p-2.5 border border-slate-700/50">
            <div class="text-[9px] text-slate-400 font-semibold uppercase">Жиры</div>
            <div id="macro-f" class="font-mono font-extrabold text-sm text-amber-300 mt-0.5">—</div>
          </div>
          <div class="bg-slate-800/60 rounded-xl p-2.5 border border-slate-700/50">
            <div class="text-[9px] text-slate-400 font-semibold uppercase">Углеводы</div>
            <div id="macro-c" class="font-mono font-extrabold text-sm text-emerald-300 mt-0.5">—</div>
          </div>
        </div>
      </div>
      <div class="glass rounded-2xl p-4 flex items-center justify-between">
        <div>
          <div class="text-xs font-bold text-slate-200 flex items-center gap-1.5">
            <svg class="w-4 h-4 text-cyan-400" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
            <span id="txt-water-title">Водный баланс</span>
          </div>
          <div id="water-count-text" class="text-[11px] text-slate-400 mt-0.5">0.0 л</div>
        </div>
        <div class="flex items-center gap-2">
          <button id="btn-water-minus" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold grid place-items-center transition">−</button>
          <span id="water-glasses" class="font-mono font-bold text-cyan-300 text-sm">0</span>
          <button id="btn-water-plus" class="w-8 h-8 rounded-lg bg-cyan-500/15 hover:bg-cyan-500/25 text-cyan-300 font-bold grid place-items-center transition">+</button>
        </div>
      </div>
      <div id="meals-container" class="space-y-3"></div>
    </section>

    <!-- ===== TAB: CHECK-IN ===== -->
    <section id="tab-checkin" class="hidden space-y-3 fade-in">
      <div class="glass rounded-2xl p-4 space-y-4">
        <h3 class="font-display font-bold text-sm text-slate-200" id="txt-daily-checkin">Утренний чек-ин</h3>
        <div>
          <label class="block text-xs text-slate-400 mb-1" id="lbl-morning-weight">Вес утром (кг)</label>
          <input type="number" step="0.1" id="input-checkin-weight" placeholder="78.4" class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-3 py-2.5 text-sm font-mono text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-slate-400 mb-1">Талия (см)</label>
            <input type="number" step="0.5" id="input-checkin-waist" placeholder="78" class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-3 py-2.5 text-sm font-mono text-white focus:outline-none" />
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">Бёдра (см)</label>
            <input type="number" step="0.5" id="input-checkin-hip" placeholder="98" class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-3 py-2.5 text-sm font-mono text-white focus:outline-none" />
          </div>
        </div>
        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="text-xs text-slate-400">Энергия</label>
            <span id="slider-energy-val" class="font-mono font-bold text-cyan-300 text-xs">8 / 10</span>
          </div>
          <input type="range" min="1" max="10" value="8" id="slider-energy" class="w-full accent-cyan-400 cursor-pointer" />
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Заметка тренеру</label>
          <textarea id="input-checkin-note" rows="2" placeholder="Сон, восстановление, аппетит..." class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none resize-none"></textarea>
        </div>
        <button id="btn-save-checkin" class="w-full bg-indigo-500 hover:bg-indigo-400 text-white font-bold text-xs py-3 rounded-xl shadow-lg shadow-indigo-500/20 transition active:scale-95">Сохранить чек-ин</button>
        <p id="checkin-status" class="text-[11px] text-center text-emerald-400 min-h-[1rem]"></p>
      </div>
      <div class="glass rounded-2xl p-4 space-y-2">
        <h3 class="font-display font-bold text-sm text-slate-200" id="txt-history-title">История замеров</h3>
        <div id="checkin-history" class="space-y-1.5"></div>
      </div>
    </section>
  </main>

  <!-- ============= REST TIMER ============= -->
  <div id="rest-timer-modal" class="hidden fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="glass-strong rounded-3xl p-6 max-w-xs w-full text-center space-y-4">
      <div class="text-xs font-semibold uppercase tracking-wider text-slate-400" id="txt-timer-label">Отдых</div>
      <div id="timer-countdown" class="font-mono font-extrabold text-5xl text-cyan-300 pulse-ring">01:30</div>
      <div class="flex items-center justify-center gap-2">
        <button id="btn-timer-minus15" class="bg-slate-800 px-3 py-1.5 rounded-lg text-xs font-bold text-slate-300">−15с</button>
        <button id="btn-timer-plus30" class="bg-slate-800 px-3 py-1.5 rounded-lg text-xs font-bold text-slate-300">+30с</button>
      </div>
      <button id="btn-timer-skip" class="w-full bg-slate-800/60 hover:bg-slate-700 text-slate-300 text-xs font-semibold py-2.5 rounded-xl">Пропустить</button>
    </div>
  </div>

  <!-- ============= BOTTOM NAV ============= -->
  <nav class="fixed bottom-0 inset-x-0 z-40 glass-strong border-t border-slate-800/60 px-4 pt-1.5 flex items-center justify-around max-w-lg mx-auto" style="padding-bottom: calc(0.375rem + var(--sab))">
    <button data-tab="workouts" class="nav-tab tab-btn active flex flex-col items-center gap-0.5 text-slate-400 py-1 px-3">
      <svg class="tab-icon w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 4v16M18 4v16M6 12h12"/></svg>
      <span class="tab-label text-[9px] font-semibold" id="nav-workouts">Тренировки</span>
    </button>
    <button data-tab="nutrition" class="nav-tab tab-btn flex flex-col items-center gap-0.5 text-slate-400 py-1 px-3">
      <svg class="tab-icon w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 8h1a4 4 0 0 1 0 8h-1M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>
      <span class="tab-label text-[9px] font-semibold" id="nav-nutrition">Питание</span>
    </button>
    <button data-tab="checkin" class="nav-tab tab-btn flex flex-col items-center gap-0.5 text-slate-400 py-1 px-3">
      <svg class="tab-icon w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      <span class="tab-label text-[9px] font-semibold" id="nav-checkin">Прогресс</span>
    </button>
  </nav>

  <!-- ============= SCRIPTS ============= -->
  <script>
  'use strict';

  /* ============ STATE ============ */
  let currentClient = null, currentProgram = null, currentPlan = null;
  let exerciseDB = {};      // id -> exercise data (from enriched payload)
  let activeDayIndex = 0, waterGlasses = 0;
  let timerInterval = null, timerSecondsLeft = 0;
  let currentLang = 'ru';
  let portalBlob = null;
  let setStates = {};       // day-idx/set-key -> done

  /* ============ I18N ============ */
  const I18N = {
    ru: {
      portalTitle:'Мой Портал',coachBadge:'David King Gym',startBtn:'В зал',finishWorkout:'Завершить тренировку',

    },

      workoutDoneTitle:'האימון הושלם! 🎉',restLabel:'מנוחה',unlockTitle:'הזן קוד גישה',
      unlockSubtitle:'הקוד נשלח על ידי המאמן',unlockBtn:'פתח פורטל',
      unlockWrongCode:'קוד שגוי',unlockExpired:'תוקף הקישור פג',unlockNoCrypto:'פתח דרך https',

      targetMuscle:'יעד',auxMuscle:'עזר',rest:'מנוחה'
    }
  };
  const t = k => (I18N[currentLang] && I18N[currentLang][k]) || I18N.ru[k] || k;

  function esc(v) { return String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

  /* ============ CRYPTO / UNLOCK ============ */
  function b64uDecode(str) {
    const b64 = str.replace(/-/g,'+').replace(/_/g,'/') + '='.repeat((4-(str.length%4))%4);
    const bin = atob(b64); const out = new Uint8Array(bin.length);
    for (let i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i); return out;
  }
  function b64uEncode(bytes) {
    let bin=''; for(let i=0;i<bytes.length;i++) bin+=String.fromCharCode(bytes[i]);
    return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  }
  async function decryptPortal(code) {
    const salt = portalBlob.slice(0,16), iv = portalBlob.slice(16,28), ct = portalBlob.slice(28);
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt = await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
    const parsed = JSON.parse(new TextDecoder().decode(pt));
    if (parsed.exp && Date.now() > parsed.exp) throw {code:'expired'};
    return parsed;
  }
  function showUnlock() {
    document.getElementById('txt-unlock-title').textContent = t('unlockTitle');
    document.getElementById('txt-unlock-subtitle').textContent = t('unlockSubtitle');
    document.getElementById('btn-unlock').textContent = t('unlockBtn');
    document.getElementById('unlock-code-input').value = '';
    document.getElementById('unlock-error').textContent = '';
    document.getElementById('unlock-screen').classList.remove('hidden');
    setTimeout(()=>document.getElementById('unlock-code-input').focus(),100);
  }
  async function attemptUnlock() {
    const err = document.getElementById('unlock-error');
    const code = document.getElementById('unlock-code-input').value.replace(/\D/g,'');
    if (code.length !== 6) { err.textContent = t('unlockWrongCode'); return; }
    if (!window.crypto || !crypto.subtle) { err.textContent = t('unlockNoCrypto'); return; }
    try {
      const parsed = await decryptPortal(code);
      document.getElementById('unlock-screen').classList.add('hidden');
      applyData(parsed);
    } catch(e) {
      err.textContent = (e && e.code === 'expired') ? t('unlockExpired') : t('unlockWrongCode');
    }
  }

  function loadInitialData() {
    const hash = window.location.hash || '';
    try {
      if (hash.startsWith('#e=')) {
        const ver = hash.substring(3);
        if (!ver.startsWith('1.')) return;
        portalBlob = b64uDecode(ver.substring(2));
        localStorage.setItem('dk_client_data', JSON.stringify({v:1, blob:b64uEncode(portalBlob)}));
        history.replaceState(null,'',window.location.pathname);
        showUnlock(); return;
      }
      if (hash.startsWith('#data=')) {
        const parsed = JSON.parse(atob(decodeURIComponent(hash.substring(6))));
        history.replaceState(null,'',window.location.pathname);
        applyData(parsed); return;
      }
      const cached = localStorage.getItem('dk_client_data');
      if (cached) {
        const p = JSON.parse(cached);
        if (p && p.v === 1 && p.blob) { portalBlob = b64uDecode(p.blob); showUnlock(); return; }
        if (p && p.client) { applyData(p); return; }
      }
    } catch(e) { console.error('load error:',e); }
    applyDemo();
  }

    if (r.waist) document.getElementById('input-checkin-waist').value = r.waist;
    if (r.hip) document.getElementById('input-checkin-hip').value = r.hip;

    box.innerHTML = list.map(r=>{

  /* ============ SET TRACKING ============ */
  function setKey(dayIdx,exIdx,setNum) { return `dk_set_${dayIdx}_${exIdx}_${setNum}`; }
  function isSetDone(dayIdx,exIdx,setNum) { return localStorage.getItem(setKey(dayIdx,exIdx,setNum))==='1'; }
  function toggleSet(dayIdx,exIdx,setNum,btn) {
    const k = setKey(dayIdx,exIdx,setNum);
    const done = localStorage.getItem(k)==='1';
    localStorage.setItem(k, done?'0':'1');
    btn.closest('.set-row').classList.toggle('set-row-done',!done);
    updateWorkoutProgress();
  }
  function updateWorkoutProgress() {
    if (!currentProgram||!currentProgram.workout_days||!currentProgram.workout_days[activeDayIndex]) return;
    const day = currentProgram.workout_days[activeDayIndex];
    let total=0,done=0;
    (day.exercises||[]).forEach((ex,ei)=>(ex.sets||[]).forEach(s=>{
      total++; if (isSetDone(activeDayIndex,ei,s.set_num||s.setNum||(s.setNum===0?0:s.set_num))) done++;
    }));
    const pct = total ? Math.round(done/total*100) : 0;
    const bar = document.getElementById('workout-progress');
    if (bar) bar.style.width = pct+'%';
    const lbl = document.getElementById('txt-progress-label');
    if (lbl) lbl.textContent = done+' / '+total;
    const pct2 = document.getElementById('txt-progress-pct');
    if (pct2) pct2.textContent = pct+'%';
  }

      lines.push(`📊 ${today.energy}/10${today.note?`\n📝 ${today.note}`:''}`);

    // Slider
    document.getElementById('slider-energy').addEventListener('input',e=>{
      document.getElementById('slider-energy-val').textContent = e.target.value+' / 10';
    });

    // Timer
    document.getElementById('btn-timer-skip').addEventListener('click',()=>{ clearInterval(timerInterval); document.getElementById('rest-timer-modal').classList.add('hidden'); });
    document.getElementById('btn-timer-plus30').addEventListener('click',()=>{ timerSecondsLeft+=30; });
    document.getElementById('btn-timer-minus15').addEventListener('click',()=>{ timerSecondsLeft=Math.max(0,timerSecondsLeft-15); });

    // Share
    document.getElementById('btn-share-report').addEventListener('click', shareReport);

    // Finish workout
    document.getElementById('btn-finish-workout').addEventListener('click',()=>{ markDone(); shareReport(); });

    // Check-in
    document.getElementById('btn-save-checkin').addEventListener('click', saveCheckin);

    // Lang
    document.getElementById('lang-select').addEventListener('change',e=>setLang(e.target.value));
  });
  </script>
</body>
</html>
