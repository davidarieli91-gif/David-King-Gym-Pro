<!DOCTYPE html>
<html lang="ru" dir="ltr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0f" />
  <meta name="description" content="David King Gym — Персональный кабинет подопечного" />
  <title>David King Gym — Мой Портал</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icon-512.png" />
  <link rel="apple-touch-icon" href="icon-512.png" />
  <link rel="stylesheet" href="src/input.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-sans: 'Inter', system-ui, sans-serif;
      --font-display: 'Plus Jakarta Sans', Inter, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; }
    body {
      font-family: var(--font-sans);
      background: #0a0a0f;
      color: #f1f5f9;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      min-height: 100dvh;
      padding-top: var(--sat);
      padding-bottom: var(--sab);
    }
    .glass { background: rgba(20,20,30,.72); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border: 1px solid rgba(255,255,255,.07); }
    .glass-strong { background: rgba(20,20,30,.9); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,.1); }
    .font-display { font-family: var(--font-display); }
    .font-mono { font-family: var(--font-mono); }
    .no-sb::-webkit-scrollbar { display: none; }
    .no-sb { -ms-overflow-style: none; scrollbar-width: none; }
    [dir="rtl"] .flip-rtl { transform: scaleX(-1); }
    .flip-rtl { transform: scaleX(1); }
    @keyframes fade-slide { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .fade-in { animation: fade-slide .3s ease both; }
    @keyframes pulse-ring { 0%,100% { box-shadow:0 0 0 0 rgba(99,102,241,.4); } 50% { box-shadow:0 0 0 8px rgba(99,102,241,0); } }
    .pulse-ring { animation: pulse-ring 2s ease-in-out infinite; }
    .prog-bar { height: 6px; border-radius: 999px; background: rgba(255,255,255,.06); overflow: hidden; }
    .prog-bar-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #6366f1, #06b6d4); transition: width .5s cubic-bezier(.4,0,.2,1); }
    .ex-img { aspect-ratio: 4/3; object-fit: cover; border-radius: 12px; width: 100%; background: #14141e; }
    .set-row-done { opacity: .5; }
    .set-row-done .set-check { background: #10b981 !important; border-color: #10b981 !important; color: #fff !important; }
    .tab-btn { transition: all .2s cubic-bezier(.4,0,.2,1); }
    .tab-btn.active { color: #818cf8; }
    .tab-btn.active .tab-icon { stroke: #818cf8; }
    .tab-btn.active .tab-label { font-weight: 700; }
    .nutri-check:checked + .meal-label { opacity: .45; text-decoration: line-through; }
    .macro-ring { transition: stroke-dashoffset .8s cubic-bezier(.4,0,.2,1); }
    #unlock-screen { z-index: 100; }
    /* ===== Professional workout engine ===== */
    .set-grid { display: grid; grid-template-columns: 34px minmax(44px,1fr) 56px 14px 50px 44px 32px 26px 24px; gap: 4px; align-items: center; }
    @media (max-width: 379px) { .set-grid { grid-template-columns: 28px minmax(38px,1fr) 50px 12px 44px 40px 30px 24px 20px; gap: 3px; } }
    .set-input { width: 100%; background: rgba(10,10,18,.65); text-align: center; border-radius: 8px; border: 1px solid rgba(255,255,255,.12); padding: 5px 2px; font-family: var(--font-mono); font-weight: 700; font-size: 12px; color: #fff; outline: none; }
    .set-input:focus { border-color: #6366f1; box-shadow: 0 0 0 2px rgba(99,102,241,.25); }
    .set-input[disabled] { opacity: .55; }
    .set-input::placeholder { color: #475569; font-weight: 600; }
    input[type=number].set-input::-webkit-outer-spin-button, input[type=number].set-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number].set-input { -moz-appearance: textfield; appearance: textfield; }
    .type-badge { font-size: 8px; font-weight: 800; text-transform: uppercase; letter-spacing: .03em; border-radius: 4px; padding: 1px 4px; display: inline-block; margin-top: 2px; }
    .tb-warmup { background: rgba(245,158,11,.15); color: #fbbf24; }
    .tb-drop { background: rgba(6,182,212,.15); color: #22d3ee; }
    .tb-failure { background: rgba(239,68,68,.15); color: #f87171; }
    .tb-amrap { background: rgba(99,102,241,.18); color: #818cf8; }
    .ex-flash { animation: ex-flash 1.2s ease; }
    @keyframes ex-flash { 0%,100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); } 30% { box-shadow: 0 0 0 3px rgba(16,185,129,.55); } }
    .mini-prog { height: 4px; border-radius: 999px; background: rgba(255,255,255,.07); overflow: hidden; }
    .mini-prog > div { height: 100%; background: #10b981; border-radius: 999px; transition: width .4s ease; }
    #rest-banner { z-index: 60; }
    #toast-box { z-index: 90; }
  </style>
</head>
<body class="flex flex-col">

  <!-- ============= HEADER ============= -->
  <header class="sticky top-0 z-40 glass-strong px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-cyan-400 grid place-items-center font-display font-extrabold text-white text-base shadow-lg shadow-indigo-500/20">DK</div>
      <div>
        <h1 id="hdr-name" class="font-display font-bold text-sm leading-tight truncate max-w-[160px]">Мой Портал</h1>
        <p id="hdr-goal" class="text-[11px] text-slate-400 truncate max-w-[160px]">David King Gym</p>
      </div>
    </div>
    <div class="flex items-center gap-1.5">
      <select id="lang-select" class="bg-slate-800/80 border border-slate-700 text-xs rounded-lg px-2 py-1.5 text-slate-200 outline-none cursor-pointer">
        <option value="ru">RU</option><option value="en">EN</option><option value="he">HE</option>
      </select>
      <button id="btn-share-report" class="bg-indigo-500/15 hover:bg-indigo-500/25 text-indigo-300 border border-indigo-500/25 rounded-lg p-2 transition" title="Share">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
      </button>
    </div>
  </header>

  <!-- ============= REST TIMER BANNER (sticky, CRM-style) ============= -->
  <div id="rest-banner" class="hidden fixed top-0 inset-x-0 glass-strong border-b border-indigo-500/30 px-4 flex items-center gap-3" style="padding-top: calc(0.5rem + var(--sat)); padding-bottom: 0.5rem;">
    <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-500 to-cyan-400 grid place-items-center shrink-0 pulse-ring">
      <svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>
    </div>
    <div class="flex-1 min-w-0">
      <div class="flex items-center justify-between">
        <span class="text-[9px] font-bold uppercase tracking-wider text-slate-400" id="txt-rest-label">Отдых</span>
        <span id="rest-banner-display" class="font-mono font-extrabold text-lg text-cyan-300 leading-none">01:30</span>
      </div>
      <div class="prog-bar mt-1"><div id="rest-banner-progress" class="prog-bar-fill" style="width:100%"></div></div>
    </div>
    <div class="flex items-center gap-1 shrink-0">
      <button id="btn-timer-minus15" class="bg-slate-800/90 px-2 py-1.5 rounded-lg text-[10px] font-bold text-slate-300 border border-slate-700">−15</button>
      <button id="btn-timer-plus30" class="bg-slate-800/90 px-2 py-1.5 rounded-lg text-[10px] font-bold text-slate-300 border border-slate-700">+30</button>
      <button id="btn-timer-skip" class="bg-slate-800/90 px-2 py-1.5 rounded-lg text-[10px] font-bold text-slate-300 border border-slate-700">✕</button>
    </div>
  </div>

  <!-- ============= UNLOCK SCREEN ============= -->
  <div id="unlock-screen" class="hidden fixed inset-0 z-[100] bg-black/90 backdrop-blur-lg flex items-center justify-center p-4">
    <div class="glass-strong rounded-3xl p-6 max-w-xs w-full text-center space-y-4">
      <div class="w-14 h-14 mx-auto rounded-2xl bg-gradient-to-tr from-indigo-500 to-cyan-400 grid place-items-center text-2xl shadow-lg shadow-indigo-500/30">🔒</div>
      <div>
        <h2 class="font-display font-bold text-base text-white" id="txt-unlock-title">Введите код доступа</h2>
        <p class="text-xs text-slate-400 mt-1" id="txt-unlock-subtitle">Код прислал тренер вместе со ссылкой</p>
      </div>
      <input type="tel" inputmode="numeric" maxlength="6" id="unlock-code-input" placeholder="••••••" autocomplete="off"
        class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-3 text-center font-mono text-xl tracking-[0.4em] text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
      <p id="unlock-error" class="text-xs text-red-400 min-h-[1rem]"></p>
      <button id="btn-unlock" class="w-full bg-gradient-to-r from-indigo-500 to-cyan-400 text-white font-bold text-sm py-3 rounded-xl shadow-lg shadow-indigo-500/25 transition active:scale-95">Открыть портал</button>
    </div>
  </div>

  <!-- ============= MAIN ============= -->
  <main class="flex-1 max-w-lg mx-auto w-full px-4 pt-4 pb-28 space-y-4">

    <!-- Hero card -->
    <div id="client-card" class="glass rounded-2xl p-4 relative overflow-hidden fade-in">
      <div class="absolute inset-0 bg-gradient-to-br from-indigo-500/8 via-transparent to-cyan-400/5 pointer-events-none"></div>
      <div class="relative">
        <div class="flex items-center justify-between mb-2">
          <span class="text-[10px] font-semibold uppercase tracking-wider text-cyan-300 flex items-center gap-1.5">
            <span id="live-dot" class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
            <span id="txt-active-program">План активен</span>
          </span>
          <span id="live-duration" class="hidden font-mono font-bold text-sm text-cyan-300">0:00</span>
        </div>
        <div class="flex items-end justify-between gap-3">
          <div class="min-w-0 flex-1">
            <div id="banner-prog-name" class="font-display font-extrabold text-lg text-white truncate">…</div>
            <div id="banner-prog-split" class="text-xs text-slate-400 mt-0.5">—</div>
          </div>
          <button id="btn-quick-start" class="bg-gradient-to-r from-indigo-500 to-cyan-400 text-white font-bold text-xs px-4 py-2.5 rounded-xl shadow-lg shadow-indigo-500/20 transition active:scale-95 flex items-center gap-1.5 shrink-0">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <span id="txt-start-btn">В зал</span>
          </button>
        </div>
        <!-- Workout progress bar -->
        <div class="mt-3">
          <div class="flex justify-between text-[10px] text-slate-400 mb-1">
            <span id="txt-progress-label">0 / 0</span>
            <span id="txt-progress-pct">0%</span>
          </div>
          <div class="prog-bar"><div id="workout-progress" class="prog-bar-fill" style="width:0%"></div></div>
        </div>
        <!-- Stat cards: exercises / sets / volume -->
        <div class="grid grid-cols-3 gap-2 mt-3">
          <div class="bg-slate-800/60 rounded-xl p-2 text-center border border-slate-700/50">
            <div class="text-[8px] text-slate-400 font-bold uppercase tracking-wide" id="lbl-stat-ex">Упражнения</div>
            <div id="stat-exercises" class="font-mono font-extrabold text-sm text-white mt-0.5">0</div>
          </div>
          <div class="bg-slate-800/60 rounded-xl p-2 text-center border border-slate-700/50">
            <div class="text-[8px] text-slate-400 font-bold uppercase tracking-wide" id="lbl-stat-sets">Подходы</div>
            <div id="stat-sets" class="font-mono font-extrabold text-sm text-white mt-0.5">0</div>
          </div>
          <div class="bg-slate-800/60 rounded-xl p-2 text-center border border-slate-700/50">
            <div class="text-[8px] text-slate-400 font-bold uppercase tracking-wide" id="lbl-stat-vol">Объём</div>
            <div id="stat-volume" class="font-mono font-extrabold text-sm text-amber-300 mt-0.5">0</div>
          </div>
        </div>
      </div>
    </div>

    <!-- ===== TAB: WORKOUTS ===== -->
    <section id="tab-workouts" class="space-y-3 fade-in">
      <div id="program-selector" class="hidden flex gap-1.5 overflow-x-auto no-sb pb-1"></div>
      <div id="days-tabs-container" class="flex items-center gap-1.5 overflow-x-auto no-sb pb-1"></div>
      <div id="workout-exercises-list" class="space-y-3"></div>
      <div id="workout-finish-box" class="pt-1 space-y-2">
        <div id="finish-summary" class="hidden glass rounded-xl px-3 py-2 flex items-center justify-between text-[11px] text-slate-300">
          <span id="finish-summary-text">—</span>
        </div>
        <button id="btn-finish-workout" class="w-full bg-emerald-500 hover:bg-emerald-400 text-white font-bold text-sm py-3.5 rounded-2xl shadow-xl shadow-emerald-500/20 transition active:scale-95 flex items-center justify-center gap-2">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
          <span id="txt-finish-workout">Завершить тренировку</span>
        </button>
      </div>
    </section>

    <!-- ===== TAB: NUTRITION ===== -->
    <section id="tab-nutrition" class="hidden space-y-3 fade-in">
      <div id="plan-selector" class="hidden flex gap-1.5 overflow-x-auto no-sb"></div>
      <div class="glass rounded-2xl p-4">
        <div class="flex justify-between items-center mb-3">
          <h3 class="font-display font-bold text-sm text-slate-200" id="txt-daily-targets">Суточная норма</h3>
          <span id="target-cal-badge" class="font-mono font-bold text-cyan-300 text-sm">—</span>
        </div>
        <div class="grid grid-cols-3 gap-2 text-center">
          <div class="bg-slate-800/60 rounded-xl p-2.5 border border-slate-700/50">
            <div class="text-[9px] text-slate-400 font-semibold uppercase">Белки</div>
            <div id="macro-p" class="font-mono font-extrabold text-sm text-indigo-300 mt-0.5">—</div>
          </div>
          <div class="bg-slate-800/60 rounded-xl p-2.5 border border-slate-700/50">
            <div class="text-[9px] text-slate-400 font-semibold uppercase">Жиры</div>
            <div id="macro-f" class="font-mono font-extrabold text-sm text-amber-300 mt-0.5">—</div>
          </div>
          <div class="bg-slate-800/60 rounded-xl p-2.5 border border-slate-700/50">
            <div class="text-[9px] text-slate-400 font-semibold uppercase">Углеводы</div>
            <div id="macro-c" class="font-mono font-extrabold text-sm text-emerald-300 mt-0.5">—</div>
          </div>
        </div>
      </div>
      <div class="glass rounded-2xl p-4 flex items-center justify-between">
        <div>
          <div class="text-xs font-bold text-slate-200 flex items-center gap-1.5">
            <svg class="w-4 h-4 text-cyan-400" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
            <span id="txt-water-title">Водный баланс</span>
          </div>
          <div id="water-count-text" class="text-[11px] text-slate-400 mt-0.5">0.0 л</div>
        </div>
        <div class="flex items-center gap-2">
          <button id="btn-water-minus" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold grid place-items-center transition">−</button>
          <span id="water-glasses" class="font-mono font-bold text-cyan-300 text-sm">0</span>
          <button id="btn-water-plus" class="w-8 h-8 rounded-lg bg-cyan-500/15 hover:bg-cyan-500/25 text-cyan-300 font-bold grid place-items-center transition">+</button>
        </div>
      </div>
      <div id="meals-container" class="space-y-3"></div>
    </section>

    <!-- ===== TAB: CHECK-IN ===== -->
    <section id="tab-checkin" class="hidden space-y-3 fade-in">
      <div class="glass rounded-2xl p-4 space-y-4">
        <h3 class="font-display font-bold text-sm text-slate-200" id="txt-daily-checkin">Утренний чек-ин</h3>
        <div>
          <label class="block text-xs text-slate-400 mb-1" id="lbl-morning-weight">Вес утром (кг)</label>
          <input type="number" step="0.1" id="input-checkin-weight" placeholder="78.4" class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-3 py-2.5 text-sm font-mono text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-slate-400 mb-1">Талия (см)</label>
            <input type="number" step="0.5" id="input-checkin-waist" placeholder="78" class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-3 py-2.5 text-sm font-mono text-white focus:outline-none" />
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">Бёдра (см)</label>
            <input type="number" step="0.5" id="input-checkin-hip" placeholder="98" class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-3 py-2.5 text-sm font-mono text-white focus:outline-none" />
          </div>
        </div>
        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="text-xs text-slate-400">Энергия</label>
            <span id="slider-energy-val" class="font-mono font-bold text-cyan-300 text-xs">8 / 10</span>
          </div>
          <input type="range" min="1" max="10" value="8" id="slider-energy" class="w-full accent-cyan-400 cursor-pointer" />
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Заметка тренеру</label>
          <textarea id="input-checkin-note" rows="2" placeholder="Сон, восстановление, аппетит..." class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none resize-none"></textarea>
        </div>
        <button id="btn-save-checkin" class="w-full bg-indigo-500 hover:bg-indigo-400 text-white font-bold text-xs py-3 rounded-xl shadow-lg shadow-indigo-500/20 transition active:scale-95">Сохранить чек-ин</button>
        <p id="checkin-status" class="text-[11px] text-center text-emerald-400 min-h-[1rem]"></p>
      </div>
      <div class="glass rounded-2xl p-4 space-y-2">
        <h3 class="font-display font-bold text-sm text-slate-200" id="txt-history-title">История замеров</h3>
        <div id="checkin-history" class="space-y-1.5"></div>
      </div>
    </section>
  </main>

  <!-- ============= TOASTS ============= -->
  <div id="toast-box" class="fixed bottom-20 inset-x-0 flex flex-col items-center gap-1.5 pointer-events-none px-4"></div>

  <!-- ============= BOTTOM NAV ============= -->
  <nav class="fixed bottom-0 inset-x-0 z-40 glass-strong border-t border-slate-800/60 px-4 pt-1.5 flex items-center justify-around max-w-lg mx-auto" style="padding-bottom: calc(0.375rem + var(--sab))">
    <button data-tab="workouts" class="nav-tab tab-btn active flex flex-col items-center gap-0.5 text-slate-400 py-1 px-3">
      <svg class="tab-icon w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 4v16M18 4v16M6 12h12"/></svg>
      <span class="tab-label text-[9px] font-semibold" id="nav-workouts">Тренировки</span>
    </button>
    <button data-tab="nutrition" class="nav-tab tab-btn flex flex-col items-center gap-0.5 text-slate-400 py-1 px-3">
      <svg class="tab-icon w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 8h1a4 4 0 0 1 0 8h-1M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>
      <span class="tab-label text-[9px] font-semibold" id="nav-nutrition">Питание</span>
    </button>
    <button data-tab="checkin" class="nav-tab tab-btn flex flex-col items-center gap-0.5 text-slate-400 py-1 px-3">
      <svg class="tab-icon w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      <span class="tab-label text-[9px] font-semibold" id="nav-checkin">Прогресс</span>
    </button>
  </nav>

  <!-- ============= SCRIPTS ============= -->
  <script>
  'use strict';

  /* ============ STATE ============ */
  let currentClient = null;
  let programs = [], plans = [];
  let activeProgramIdx = 0, activePlanIdx = 0;
  let currentProgram = null, currentPlan = null;
  let exerciseDB = {};
  let activeDayIndex = 0, waterGlasses = 0;

  /* ============ CRYPTO / UNLOCK ============ */
  function b64uDecode(str) {
    const b64 = str.replace(/-/g,'+').replace(/_/g,'/') + '='.repeat((4-(str.length%4))%4);
    const bin = atob(b64); const out = new Uint8Array(bin.length);
    for (let i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i); return out;
  }
  function b64uEncode(bytes) {
    let bin=''; for(let i=0;i<bytes.length;i++) bin+=String.fromCharCode(bytes[i]);
    return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  }
  async function decryptPortal(code) {
    const salt = portalBlob.slice(0,16), iv = portalBlob.slice(16,28), ct = portalBlob.slice(28);
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt = await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
    const parsed = JSON.parse(new TextDecoder().decode(pt));
    if (parsed.exp && Date.now() > parsed.exp) throw {code:'expired'};
    return parsed;
  }

  async function attemptUnlock() {
    const err = document.getElementById('unlock-error');
    const code = document.getElementById('unlock-code-input').value.replace(/\D/g,'');
    if (code.length !== 6) { err.textContent = t('unlockWrongCode'); return; }
    if (!window.crypto || !crypto.subtle) { err.textContent = t('unlockNoCrypto'); return; }
    try {
      const parsed = await decryptPortal(code);
      document.getElementById('unlock-screen').classList.add('hidden');
      applyData(parsed);
    } catch(e) {
      err.textContent = (e && e.code === 'expired') ? t('unlockExpired') : t('unlockWrongCode');
    }
  }

  function loadInitialData() {
    const hash = window.location.hash || '';
    try {
      if (hash.startsWith('#e=')) {
        const ver = hash.substring(3);
        if (!ver.startsWith('1.')) return;
        portalBlob = b64uDecode(ver.substring(2));
        localStorage.setItem('dk_client_data', JSON.stringify({v:1, blob:b64uEncode(portalBlob)}));
        history.replaceState(null,'',window.location.pathname);
        showUnlock(); return;
      }
      if (hash.startsWith('#data=')) {
        const parsed = JSON.parse(atob(decodeURIComponent(hash.substring(6))));
        history.replaceState(null,'',window.location.pathname);
        applyData(parsed); return;
      }
      const cached = localStorage.getItem('dk_client_data');
      if (cached) {
        const p = JSON.parse(cached);
        if (p && p.v === 1 && p.blob) { portalBlob = b64uDecode(p.blob); showUnlock(); return; }
        if (p && p.client) { applyData(p); return; }
      }
    } catch(e) { console.error('load error:',e); }
    applyDemo();
  }

  function saveHistory(list) { localStorage.setItem('dk_workout_history', JSON.stringify(list.slice(-60))); }
  function findPrev(programName, dayLetter, key, setIndex) {
    const list = loadHistory();
    for (let i = list.length - 1; i >= 0; i--) {
      const r = list[i];
      if (r.program !== programName || r.day_letter !== dayLetter) continue;
      const ex = (r.exercises||[]).find(e => e.key === key);
      if (!ex || !ex.sets || !ex.sets.length) continue;
      const s = ex.sets[Math.min(setIndex, ex.sets.length-1)];
      return { weight: s.weight, reps: s.reps };
    }
    return null;
  }

  /* --- draft autosave (per program) --- */
  let saveTimer = null;
  function progKeyForDraft(idx){
    const p = programs[idx != null ? idx : activeProgramIdx];
    if (!p) return 'default';
    return String(p.id != null ? p.id : (p.name || idx));
  }
  function loadDraftRaw(){ try { return JSON.parse(localStorage.getItem('dk_live_draft')||'null'); } catch(e){ return null; } }
  function saveDraft(immediate) {
    const doSave = () => {
      try {
        const raw = loadDraftRaw() || {};
        const byProgram = raw.byProgram || {};
        // migrate legacy flat sessions if needed
        if (raw.sessions && !raw.byProgram) {
          const legacyKey = progKeyForDraft(activeProgramIdx);
          if (!byProgram[legacyKey]) byProgram[legacyKey] = raw.sessions;
        }
        const key = progKeyForDraft(activeProgramIdx);
        if (Object.keys(sessions).length) byProgram[key] = sessions;
        else delete byProgram[key];
        const out = { savedAt: Date.now(), byProgram };
        // keep legacy sessions for old portal versions reading the draft
        if (Object.keys(sessions).length) out.sessions = sessions;
        localStorage.setItem('dk_live_draft', JSON.stringify(out));
      } catch(e){}
    };
    if (immediate) { doSave(); return; }
    clearTimeout(saveTimer); saveTimer = setTimeout(doSave, 400);
  }
  function checkDraft() {
    const d = loadDraftRaw();
    if (!d) return;
    if (Date.now() - (d.savedAt||0) > 24*3600*1000) { localStorage.removeItem('dk_live_draft'); return; }
    // new format: byProgram
    let candidate = null;
    if (d.byProgram) candidate = d.byProgram[progKeyForDraft(activeProgramIdx)] || null;
    else if (d.sessions) candidate = d.sessions; // legacy single-program draft
    if (!candidate || !Object.keys(candidate).length) return;
    const kept = {};
    Object.keys(candidate).forEach(k => { if (dayInfo(+k)) kept[k] = candidate[k]; });
    if (!Object.keys(kept).length) return;
    if (confirm(t('draftFound'))) {
      sessions = kept;
      toast(t('draftRestored'));
    } else {
      sessions = {};
      const raw = loadDraftRaw();
      if (raw && raw.byProgram) { delete raw.byProgram[progKeyForDraft(activeProgramIdx)]; localStorage.setItem('dk_live_draft', JSON.stringify(raw)); }
      else localStorage.removeItem('dk_live_draft');
    }
    renderAll();
  }
  document.addEventListener('visibilitychange', () => { if (document.hidden) saveDraft(true); });
  setInterval(() => { if (Object.keys(sessions).length) saveDraft(true); }, 30000);

  /* --- session lifecycle --- */
  function buildSession(dayIdx) {
    const day = dayInfo(dayIdx); if (!day) return null;
    const letter = day.day_letter || String(dayIdx+1);
    const progName = (currentProgram && currentProgram.name) || '';
    return {
      started_at: Date.now(),
      exercises: (day.exercises||[]).map(ex => ({
        exercise_id: exKey(ex),
        rest_sec: parseInt(ex.rest_sec,10) || 90,
        sets: (ex.sets||[]).map((s, si) => {
          const hist = findPrev(progName, letter, exKey(ex), si);
          const pw = hist ? hist.weight : (Number(s.weight)||null);
          const pr = hist ? hist.reps : (Number(s.reps)||null);
          return { weight:null, reps:null, rpe:null, type:'normal', done:false, prev_weight:pw, prev_reps:pr };
        })
      }))
    };
  }
  function getSession(idx) { return sessions[idx] || null; }

  function startOrResumeDay() {
    const idx = activeDayIndex;
    if (!dayInfo(idx)) return;
    if (!sessions[idx]) {
      sessions[idx] = buildSession(idx);
      saveDraft(true);
    }
    updateLiveUI();
    renderExercises();
    const firstUndone = document.querySelector('#workout-exercises-list .set-row:not(.set-row-done) .set-input');
    if (firstUndone) firstUndone.scrollIntoView({behavior:'smooth',block:'center'});
  }

  function fmtDuration(ms) {
    const s = Math.max(0, Math.floor(ms/1000));
    const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
    return h > 0 ? `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}` : `${m}:${String(sec).padStart(2,'0')}`;
  }
  function sessionVolume(sess) {
    let v = 0;
    (sess.exercises||[]).forEach(ex => (ex.sets||[]).forEach(s => { v += (Number(s.weight)||0) * (Number(s.reps)||0); }));
    return Math.round(v);
  }
  function sessionSetCount(sess, onlyDone) {
    let total = 0, done = 0;
    (sess.exercises||[]).forEach(ex => (ex.sets||[]).forEach(s => { total++; if (s.done) done++; }));
    return onlyDone ? done : total;
  }

  /* duration ticker */
  setInterval(() => {
    if (getSession(activeDayIndex)) updateLiveUI();
  }, 1000);

  /* --- stats / hero --- */
  function updateLiveUI() {
    const sess = getSession(activeDayIndex);
    const dot = document.getElementById('live-dot');
    const badge = document.getElementById('txt-active-program');
    const dur = document.getElementById('live-duration');
    const startBtnSpan = document.getElementById('txt-start-btn');
    const active = !!(sess && sess.started_at);
    if (badge) badge.textContent = active ? t('liveBadge') : 'План активен';
    if (dot) dot.className = active ? 'w-2 h-2 rounded-full bg-emerald-400 animate-pulse' : 'w-2 h-2 rounded-full bg-cyan-400 animate-pulse';
    if (dur) dur.classList.toggle('hidden', !active);
    if (startBtnSpan) startBtnSpan.textContent = active ? t('resumeBtn') : t('startBtn');
    // stats
    const day = dayInfo(activeDayIndex);
    const exCount = sess ? (sess.exercises||[]).length : ((day&&day.exercises||[]).length);
    const setCount = sess ? sessionSetCount(sess,false) : ((day&&day.exercises||[]).reduce((s,ex)=>s+((ex.sets||[]).length),0));
    const volume = sess ? sessionVolume(sess) : 0;
    const se = document.getElementById('stat-exercises'), ss = document.getElementById('stat-sets'), sv = document.getElementById('stat-volume');
    if (se) se.textContent = exCount;
    if (ss) ss.textContent = setCount;
    if (sv) sv.textContent = volume ? volume.toLocaleString('ru-RU') : '0';
    // progress bar (done/total sets of the day)
    let total = 0, done = 0;
    if (sess) { total = sessionSetCount(sess,false); done = sessionSetCount(sess,true); }
    else if (day) { (day.exercises||[]).forEach(ex => (ex.sets||[]).forEach(()=>total++)); }
    const pct = total ? Math.round(done/total*100) : 0;
    const bar = document.getElementById('workout-progress');
    if (bar) bar.style.width = pct+'%';
    const lbl = document.getElementById('txt-progress-label');
    if (lbl) lbl.textContent = done+' / '+total;
    const pct2 = document.getElementById('txt-progress-pct');
    if (pct2) pct2.textContent = pct+'%';
    // finish summary
    const fs = document.getElementById('finish-summary');
    const fst = document.getElementById('finish-summary-text');
    if (fs && fst) {
      if (sess && active) {
        fs.classList.remove('hidden');
        fst.textContent = `⏱ ${fmtDuration(Date.now()-sess.started_at)} · ${t('sumVolume')}: ${sessionVolume(sess).toLocaleString('ru-RU')} ${t('volumeKg')} · ${t('sumDone')}: ${sessionSetCount(sess,true)}/${sessionSetCount(sess,false)}`;
      } else fs.classList.add('hidden');
    }
  }

  /* --- rest timer (sticky banner, CRM parity) --- */
  let timerInterval = null, timerSecondsLeft = 0, timerTotal = 0;
  function beepRestDone() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = 'sine'; osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.18, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime + 0.5);
    } catch(e){}
    try { if (navigator.vibrate) navigator.vibrate([200,100,200,100,400]); } catch(e){}
  }
  function startRest(sec) {
    clearInterval(timerInterval);
    timerTotal = Math.max(5, sec||90); timerSecondsLeft = timerTotal;
    const banner = document.getElementById('rest-banner');
    banner.classList.remove('hidden');
    updateRestDisplay();
    timerInterval = setInterval(() => {
      timerSecondsLeft--;
      updateRestDisplay();
      if (timerSecondsLeft <= 0) {
        clearInterval(timerInterval);
        banner.classList.add('hidden');
        toast(t('restDone'));
        beepRestDone();
      }
    }, 1000);
  }
  function updateRestDisplay() {
    const m = Math.floor(Math.max(0,timerSecondsLeft)/60), s = Math.max(0,timerSecondsLeft)%60;
    document.getElementById('rest-banner-display').textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    document.getElementById('rest-banner-progress').style.width = Math.max(0, timerSecondsLeft/timerTotal*100) + '%';
  }
  function stopRest() { clearInterval(timerInterval); document.getElementById('rest-banner').classList.add('hidden'); }

  /* --- render: day tabs --- */
  function renderDaysTabs() {
    const c = document.getElementById('days-tabs-container');
    const _wdays = currentProgram ? (currentProgram.workout_days || currentProgram.days || []) : [];
    if (!_wdays.length) { c.innerHTML=''; return; }
    c.innerHTML = _wdays.map((d,i)=>{
      const active = i===activeDayIndex;
      const live = !!sessions[i];
      const badge = live ? '<span class="w-1.5 h-1.5 rounded-full bg-emerald-400 inline-block"></span>' : '';
      return `<button data-day="${i}" class="px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition flex items-center gap-1.5 ${active?'bg-indigo-500 text-white shadow-md shadow-indigo-500/25':'bg-slate-800/60 text-slate-400 hover:text-white'}">${badge}${esc(dayLabel(i))}</button>`;
    }).join('');
    c.querySelectorAll('[data-day]').forEach(b=>b.addEventListener('click',()=>{
      activeDayIndex = +b.dataset.day; renderAll();
    }));
  }

  /* --- render: exercises + sets --- */
  function typeBadge(type) {
    if (!type || type === 'normal') return '';
    const cls = { warmup:'tb-warmup', drop:'tb-drop', failure:'tb-failure', amrap:'tb-amrap' }[type] || '';
    return `<span class="type-badge ${cls}">${esc(t(TYPE_I18N[type]||''))}</span>`;
  }

  function renderExercises() {
    const list = document.getElementById('workout-exercises-list');
    const day = dayInfo(activeDayIndex);
    const sess = getSession(activeDayIndex);
    if (!day) { list.innerHTML = ''; return; }
    if (!(day.exercises||[]).length) {
      list.innerHTML = '<div class="text-xs text-slate-500 text-center py-6">'+esc(t('noExercises'))+'</div>'; return;
    }
    const lang = currentLang;
    const editable = !!sess;

    list.innerHTML = (day.exercises||[]).map((ex, ei)=>{
      const exData = getExData(ex);
      const exName = exData ? (exData['name_'+lang] || exData.name_en || ex.name) : (ex['name_'+lang] || ex.name_en || ex.name || '?');
      const img = exData && exData.images && exData.images[0] ? exData.images[0] : '';
      const technique = exData ? (exData['technique_'+lang] || exData.technique_en || '') : '';
      const equipment = exData ? (exData.equipment || '') : '';
      const groupLabel = exData ? (exData['group_'+lang] || exData.group_en || ex.group || '') : (ex.group || '');
      const liveEx = sess ? (sess.exercises||[])[ei] : null;
      const restSec = liveEx ? liveEx.rest_sec : (parseInt(ex.rest_sec,10) || 90);

      // per-exercise mini progress
      let mini = '';
      if (liveEx) {
        const tot = (liveEx.sets||[]).length;
        const dn = (liveEx.sets||[]).filter(s=>s.done).length;
        mini = `<div class="flex items-center gap-2 mt-1.5">
          <div class="mini-prog flex-1"><div style="width:${tot?Math.round(dn/tot*100):0}%"></div></div>
          <span class="font-mono text-[9px] text-slate-400 shrink-0">${dn}/${tot}</span>
        </div>`;
      }

      const setsRows = (liveEx ? liveEx.sets : (ex.sets||[])).map((s, si)=>{
        const sn = si + 1;
        const done = !!(s.done);
        const pw = (s.prev_weight != null || s.prev_reps != null)
          ? `${s.prev_weight!=null?Number(s.prev_weight):'—'}×${s.prev_reps!=null?Number(s.prev_reps):'—'}`
          : '—';
        const dis = editable ? '' : 'disabled';
        const repsPh = s.type === 'amrap' ? '∞' : (Number(s.reps)||'');
        return `<div class="set-row set-grid bg-slate-800/50 px-2 py-1.5 rounded-xl ${done?'set-row-done':''}" data-si="${si}">
          <div class="text-center leading-tight">
            <div class="font-mono text-[11px] font-bold text-slate-300">#${sn}</div>
            ${typeBadge(s.type)}
          </div>
          <div class="font-mono text-[10px] text-slate-500 text-center truncate" data-prev-cell>${esc(pw)}</div>
          <input type="number" step="0.5" inputmode="decimal" value="${s.weight!=null?Number(s.weight):''}" ${dis} data-field="weight" data-ex="${ei}" data-si="${si}" class="set-input" placeholder="0" />
          <span class="text-[9px] text-slate-500 text-center">×</span>
          <input type="number" step="1" inputmode="numeric" value="${s.type==='amrap'?'':(s.reps!=null?Number(s.reps):'')}" ${dis} data-field="reps" data-ex="${ei}" data-si="${si}" class="set-input" placeholder="${s.type==='amrap'?'∞':'0'}" />
          <input type="number" step="0.5" min="0" max="10" inputmode="decimal" value="${s.rpe!=null?Number(s.rpe):''}" ${dis} data-field="rpe" data-ex="${ei}" data-si="${si}" class="set-input" placeholder="10" />
          <button class="set-check w-7 h-7 rounded-lg bg-slate-800 border border-slate-600 hover:border-emerald-400 hover:bg-emerald-400/15 text-slate-400 hover:text-emerald-400 grid place-items-center transition ${done?'':''}"
            data-toggle-set data-ex="${ei}" data-si="${si}" ${editable?'':'disabled'}>✓</button>
          <button class="w-6 h-7 grid place-items-center rounded-lg text-slate-400 hover:text-cyan-300 transition" data-cycle-type data-ex="${ei}" data-si="${si}" title="type" ${editable?'':'disabled'}>
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
          <button class="w-5 h-7 grid place-items-center rounded-lg text-slate-500 hover:text-red-400 transition" data-remove-set data-ex="${ei}" data-si="${si}" ${si===0?'disabled style="opacity:.25"':''}>×</button>
        </div>`;
      }).join('');

      const addSetBtn = editable ? `<button class="w-full mt-1.5 bg-indigo-500/10 hover:bg-indigo-500/20 text-indigo-300 border border-indigo-500/25 text-[11px] font-bold py-1.5 rounded-xl transition" data-add-set data-ex="${ei}">
          <span class="inline-flex items-center gap-1"><svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M12 5v14M5 12h14"/></svg>${esc(t('addSet'))}</span>
        </button>` : '';

      const techniqueHtml = technique ? `<details class="group"><summary class="text-[11px] font-semibold text-indigo-300 cursor-pointer select-none flex items-center gap-1">
          <svg class="w-3 h-3 transition-transform group-open:rotate-90" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
          ${esc(t('technique'))}</summary>
          <div class="mt-1.5 space-y-1 pl-1">${technique.split(' | ').map(st=>`<p class="text-[11px] text-slate-300 leading-relaxed">• ${esc(st.trim())}</p>`).join('')}</div></details>` : '';

      return `<div class="glass rounded-2xl p-4 space-y-3 fade-in" data-exercise-card="${ei}">
        <div class="flex items-start justify-between gap-2">
          ${img ? `<img src="${esc(img)}" alt="" class="ex-img w-16 h-16 sm:w-20 sm:h-20 shrink-0 object-cover" loading="lazy" />` : ''}
          <div class="flex-1 min-w-0">
            <h4 class="font-display font-bold text-sm text-white leading-snug">${esc(exName)}</h4>
            <div class="text-[11px] text-slate-400 flex items-center gap-2 mt-0.5 flex-wrap">
              ${groupLabel?`<span class="text-cyan-300">${esc(groupLabel)}</span><span>·</span>`:''}
              <label class="flex items-center gap-1">${esc(t('restPerEx'))}
                <input type="number" min="10" step="5" value="${restSec}" data-rest-input data-ex="${ei}" ${editable?'':'disabled'} class="w-12 bg-slate-900/60 text-center rounded border border-slate-700 py-0.5 text-[10px] font-mono text-white focus:outline-none" />
              </label>

        <div class="set-grid px-2 text-[8px] uppercase tracking-wide text-slate-500 font-bold">
          <span>#</span><span class="text-center">${esc(t('prevLabel'))}</span><span class="text-center">${esc(t('weightLabel'))}</span><span></span><span class="text-center">${esc(t('repsLabel'))}</span><span class="text-center">${esc(t('rpeLabel'))}</span><span class="text-center">✓</span><span></span><span></span>
        </div>
        <div class="space-y-1.5">${setsRows}</div>
        ${addSetBtn}
        ${techniqueHtml}
      </div>`;
    }).join('');

    wireExerciseEvents();
    updateLiveUI();
  }

  function wireExerciseEvents() {
    const list = document.getElementById('workout-exercises-list');
    const sess = getSession(activeDayIndex);
    if (!sess) return; // read-only plan view

    // weight / reps / rpe inputs
    list.querySelectorAll('[data-field]').forEach(inp => {
      inp.addEventListener('input', () => {
        const ei = +inp.dataset.ex, si = +inp.dataset.si, f = inp.dataset.field;
        const set = ((sess.exercises||[])[ei]||{}).sets?.[si];
        if (!set) return;
        const v = inp.value.trim();
        if (f === 'weight') set.weight = v === '' ? null : parseFloat(v);
        else if (f === 'reps') set.reps = v === '' ? null : parseInt(v,10);
        else set.rpe = v === '' ? null : parseFloat(v);
        saveDraft(); updateLiveUI();
      });
    });

    // done toggle
    list.querySelectorAll('[data-toggle-set]').forEach(btn => {
      btn.addEventListener('click', () => {
        const ei = +btn.dataset.ex, si = +btn.dataset.si;
        const ex = (sess.exercises||[])[ei]; const set = ex && ex.sets[si];
        if (!set) return;
        set.done = !set.done;
        if (set.done) {
          // copy current values into next set's prev (CRM parity)
          const next = ex.sets[si+1];
          if (next) {
            next.prev_weight = set.weight != null ? set.weight : next.prev_weight;
            next.prev_reps = set.reps != null ? set.reps : next.prev_reps;
            const row = btn.closest('[data-exercise-card]').querySelector(`.set-row[data-si="${si+1}"] [data-prev-cell]`);
            if (row) row.textContent = `${set.weight!=null?set.weight:'—'}×${set.reps!=null?set.reps:'—'}`;
          }
          startRest(ex.rest_sec || 90);
        }
        const row = btn.closest('.set-row');
        row.classList.toggle('set-row-done', set.done);
        saveDraft(); updateLiveUI(); updateMiniProgress(ei);
        // auto-scroll when all sets of the exercise are done
        if (set.done && ex.sets.every(s=>s.done)) {
          const card = btn.closest('[data-exercise-card]');
          card.classList.add('ex-flash');
          const nextCard = document.querySelector(`[data-exercise-card="${ei+1}"]`);
          if (nextCard) setTimeout(()=>nextCard.scrollIntoView({behavior:'smooth',block:'center'}), 350);
        }
      });
    });

    // type cycle
    list.querySelectorAll('[data-cycle-type]').forEach(btn => {
      btn.addEventListener('click', () => {
        const ei = +btn.dataset.ex, si = +btn.dataset.si;
        const set = ((sess.exercises||[])[ei]||{}).sets?.[si];
        if (!set) return;
        const i = SET_TYPES.indexOf(set.type || 'normal');
        set.type = SET_TYPES[(i+1) % SET_TYPES.length];
        const row = btn.closest('.set-row');
        const numCell = row.querySelector('div');
        const old = numCell.querySelector('.type-badge');
        if (old) old.remove();
        if (set.type !== 'normal') numCell.insertAdjacentHTML('beforeend', typeBadge(set.type));
        const repsInp = row.querySelector('[data-field="reps"]');
        if (set.type === 'amrap') { repsInp.value = ''; repsInp.placeholder = '∞'; }
        else if (repsInp.placeholder === '∞') repsInp.placeholder = '0';
        saveDraft();
      });
    });

    // add set
    list.querySelectorAll('[data-add-set]').forEach(btn => {
      btn.addEventListener('click', () => {
        const ei = +btn.dataset.ex;
        const ex = (sess.exercises||[])[ei]; if (!ex) return;
        const last = (ex.sets||[])[ex.sets.length-1];
        ex.sets.push({
          weight: last ? last.weight : null,
          reps: last ? last.reps : null,
          rpe: null, type: last ? last.type : 'normal', done: false,
          prev_weight: last ? last.weight : null,
          prev_reps: last ? last.reps : null
        });
        saveDraft(); renderExercises();
        const rows = document.querySelectorAll(`[data-exercise-card="${ei}"] .set-row`);
        if (rows.length) {
          rows[rows.length-1].scrollIntoView({behavior:'smooth',block:'center'});
          rows[rows.length-1].querySelector('[data-field="weight"]')?.focus();
        }
      });
    });

    // remove set
    list.querySelectorAll('[data-remove-set]').forEach(btn => {
      btn.addEventListener('click', () => {
        const ei = +btn.dataset.ex, si = +btn.dataset.si;
        const ex = (sess.exercises||[])[ei];
        if (!ex || si === 0 || ex.sets.length <= 1) return;
        ex.sets.splice(si, 1);
        saveDraft(); renderExercises();
      });
    });

    // per-exercise rest input
    list.querySelectorAll('[data-rest-input]').forEach(inp => {
      inp.addEventListener('change', () => {
        const ei = +inp.dataset.ex;
        const ex = (sess.exercises||[])[ei]; if (!ex) return;
        const v = parseInt(inp.value,10);
        ex.rest_sec = (v && v >= 5) ? v : 90;
        inp.value = ex.rest_sec;
        saveDraft();
      });
    });
  }

  function updateMiniProgress(ei) {
    const sess = getSession(activeDayIndex); if (!sess) return;
    const ex = (sess.exercises||[])[ei]; if (!ex) return;
    const card = document.querySelector(`[data-exercise-card="${ei}"]`); if (!card) return;
    const tot = (ex.sets||[]).length, dn = (ex.sets||[]).filter(s=>s.done).length;
    const bar = card.querySelector('.mini-prog > div');
    const lbl = card.querySelector('.mini-prog + span, .mini-prog ~ span');
    if (bar) bar.style.width = (tot?Math.round(dn/tot*100):0)+'%';
    if (lbl) lbl.textContent = dn+'/'+tot;
  }

  /* --- finish workout --- */
  function finishWorkout() {
    const idx = activeDayIndex;
    const sess = getSession(idx);
    if (!sess) { toast(t('startHint'), 'warn'); return; }
    const day = dayInfo(idx);
    const total = sessionSetCount(sess,false), done = sessionSetCount(sess,true);
    if (!total) return;
    if (!confirm(t('finishConfirm'))) return;
    const duration = Date.now() - sess.started_at;
    const volume = sessionVolume(sess);
    const letter = day.day_letter || String(idx+1);
    const progName = (currentProgram && currentProgram.name) || '';
    const rec = {
      ts: Date.now(), date: todayKey(),
      program: progName, day_letter: letter, day_index: idx,
      duration_sec: Math.round(duration/1000), volume,
      done_sets: done, total_sets: total,
      exercises: (sess.exercises||[]).map((lex, ei) => {
        const dayEx = (day.exercises||[])[ei] || {};
        const exData = getExData(dayEx);
        return {
          key: lex.exercise_id,
          name: exData ? (exData['name_'+currentLang] || exData.name_en || dayEx.name) : (dayEx['name_'+currentLang] || dayEx.name_en || dayEx.name || lex.exercise_id),
          sets: (lex.sets||[]).map(s => ({ weight: s.weight, reps: s.reps, rpe: s.rpe, type: s.type, done: !!s.done }))
        };
      })
    };
    const hist = loadHistory(); hist.push(rec); saveHistory(hist);
    delete sessions[idx];
    saveDraft(true);
    stopRest();
    markDone();
    toast(t('workoutSaved'));
    shareReport({ workout: rec });
    renderAll();
  }

  /* ============ WORKOUT DONE ============ */
  function markDone() {
    const done = JSON.parse(localStorage.getItem('dk_done_days')||'{}');
    done[todayKey()] = (currentProgram&&currentProgram.name)||'';
    localStorage.setItem('dk_done_days',JSON.stringify(done));
    refreshDone();
  }
  function refreshDone() {
    const btn = document.getElementById('btn-finish-workout');
    if (!btn) return;
    const isDone = JSON.parse(localStorage.getItem('dk_done_days')||'{}')[todayKey()];
    btn.classList.toggle('opacity-60',!!isDone); btn.classList.toggle('pointer-events-none',!!isDone);
    btn.querySelector('span').textContent = isDone ? t('doneToday') : t('finishWorkout');
  }

  /* ============ SHARE ============ */
  function shareReport(opts) {
    const name = (currentClient&&currentClient.full_name)||'Клиент';
    const prog = (currentProgram&&currentProgram.name)||'—';
    const day = dayLabel(activeDayIndex);
    const list = loadCheckins();
    const today = list.find(r=>r.date===todayKey())||null;
    const first = list[0]||null;
    const lines = ['👋 David King Gym'];
    lines.push(`✅ ${name} — ${prog} (${day})`);
    const sess = getSession(activeDayIndex);
    const wr = opts && opts.workout;
    if (wr) {
      const mm = Math.floor(wr.duration_sec/60), sec = wr.duration_sec%60;
      lines.push(`⏱ ${mm}:${String(sec).padStart(2,'0')} · 🏋️ ${wr.volume.toLocaleString('ru-RU')} ${t('volumeKg')} · ✔ ${wr.done_sets}/${wr.total_sets}`);
      (wr.exercises||[]).forEach(ex => {
        const parts = (ex.sets||[]).map(s => `${s.weight!=null?s.weight:'—'}×${s.reps!=null?s.reps:'—'}${s.done?'✓':''}`);
        if (parts.length) lines.push(`• ${ex.name}: ${parts.join(', ')}`);
      });
    } else if (sess) {
      lines.push(`⏱ ${fmtDuration(Date.now()-sess.started_at)} · 🏋️ ${sessionVolume(sess).toLocaleString('ru-RU')} ${t('volumeKg')} · ✔ ${sessionSetCount(sess,true)}/${sessionSetCount(sess,false)}`);
    }
    lines.push(`💧 ${(waterGlasses*0.25).toFixed(1)} л`);
    if (today) {
      lines.push(`📋 ${today.date}: ⚖️ ${today.weight} кг${today.waist?`, 📏 ${today.waist} см`:''}`);
      lines.push(`📊 ${today.energy}/10${today.note?`\n📝 ${today.note}`:''}`);
      if (first && first!==today && first.weight) {
        const tot = +(today.weight-first.weight).toFixed(1);
        if (tot!==0) lines.push(`📈 ${tot>0?'+':''}${tot} кг`);
      }
    }
    window.open(`https://wa.me/?text=${encodeURIComponent(lines.join('\n'))}`,'_blank');
  }

  /* ============ EXERCISE DATA LOOKUP ============ */
  function getExData(ex) {
    if (!ex) return null;
    return exerciseDB[ex.exercise_id] || exerciseDB[ex.id] || null;
  }

  function renderProgramSelector(){
    const c=document.getElementById('program-selector');
    if (!c) return;
    if (!programs.length){ c.classList.add('hidden'); c.innerHTML=''; return; }
    if (programs.length===1){
      const p=programs[0];
      c.innerHTML=`<span class="text-[11px] text-slate-400">${esc(t('chooseProgram'))}:</span><span class="text-xs font-bold text-white bg-indigo-500/20 border border-indigo-500/30 px-2.5 py-1 rounded-xl">${esc(p.name||'Program')}</span>`;
      c.classList.remove('hidden');
      c.className='flex items-center gap-2 overflow-x-auto no-sb pb-1';
      return;
    }
    c.classList.remove('hidden');
    c.className='flex items-center gap-1.5 overflow-x-auto no-sb pb-1';
    c.innerHTML=`<span class="text-[11px] text-slate-400 shrink-0">${esc(t('chooseProgram'))}:</span>`+programs.map((p,i)=>{
      const active=i===activeProgramIdx;
      const ds=(p.workout_days||p.days||[]).length;
      return `<button data-prog-idx="${i}" class="px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition shrink-0 ${active?'bg-indigo-500 text-white shadow-md shadow-indigo-500/25':'bg-slate-800/60 text-slate-400 hover:text-white'}">${esc(p.name||('Program '+(i+1)))}${ds?` <span class="opacity-60 text-[10px]">${ds}d</span>`:''}</button>`;
    }).join('');
    c.querySelectorAll('[data-prog-idx]').forEach(b=>b.addEventListener('click',()=>switchProgram(+b.dataset.progIdx)));
  }
  function renderPlanSelector(){
    const c=document.getElementById('plan-selector');
    if (!c) return;
    if (!plans.length){ c.classList.add('hidden'); c.innerHTML=''; return; }
    if (plans.length===1){
      const p=plans[0];
      c.innerHTML=`<span class="text-[11px] text-slate-400">${esc(t('choosePlan'))}:</span><span class="text-xs font-bold text-white bg-emerald-500/20 border border-emerald-500/30 px-2.5 py-1 rounded-xl">${esc(p.name||'Plan')} · ${(p.target_calories||'—')} ккал</span>`;
      c.classList.remove('hidden');
      c.className='flex items-center gap-2 overflow-x-auto no-sb';
      return;
    }
    c.classList.remove('hidden');
    c.className='flex items-center gap-1.5 overflow-x-auto no-sb';
    c.innerHTML=`<span class="text-[11px] text-slate-400 shrink-0">${esc(t('choosePlan'))}:</span>`+plans.map((p,i)=>{
      const active=i===activePlanIdx;
      return `<button data-plan-idx="${i}" class="px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition shrink-0 ${active?'bg-emerald-500 text-white shadow-md shadow-emerald-500/25':'bg-slate-800/60 text-slate-400 hover:text-white'}">${esc(p.name||('Plan '+(i+1)))} <span class="opacity-60 text-[10px]">${p.target_calories||'—'}ккал</span></button>`;
    }).join('');
    c.querySelectorAll('[data-plan-idx]').forEach(b=>b.addEventListener('click',()=>switchPlan(+b.dataset.planIdx)));
  }
  function switchProgram(idx){
    if (idx===activeProgramIdx || !programs[idx]) return;
    saveDraft(true);
    activeProgramIdx=idx; syncCurrentRefs(); activeDayIndex=0;
    const raw=loadDraftRaw();
    const key=progKeyForDraft(idx);
    const stored=raw && raw.byProgram ? raw.byProgram[key] : null;
    sessions = stored && typeof stored==='object' ? stored : {};
    renderAll();
  }
  function switchPlan(idx){
    if (idx===activePlanIdx || !plans[idx]) return;
    activePlanIdx=idx; syncCurrentRefs();
    renderAll();
  }
  /* ============ RENDER ============ */
  function renderAll() {
    if (!currentClient) return;
    syncCurrentRefs();
    // Header
    document.getElementById('hdr-name').textContent = currentClient.full_name || t('portalTitle');
    document.getElementById('hdr-goal').textContent = (currentClient.goal||'') + ' • David King Gym';
    // Banner
    if (currentProgram) {
      document.getElementById('banner-prog-name').textContent = currentProgram.name;
      document.getElementById('banner-prog-split').textContent = 'Сплит: ' + (currentProgram.split_type||'').toUpperCase();
    } else {
      document.getElementById('banner-prog-name').textContent = t('noProgram');
      document.getElementById('banner-prog-split').textContent = '—';
    }
    // Nutrition targets
    if (currentPlan) {
      document.getElementById('target-cal-badge').textContent = (currentPlan.target_calories||'—') + ' ккал';
      document.getElementById('macro-p').textContent = (currentPlan.target_protein||'—') + ' г';
      document.getElementById('macro-f').textContent = (currentPlan.target_fat||'—') + ' г';
      document.getElementById('macro-c').textContent = (currentPlan.target_carbs||'—') + ' г';
    } else {
      document.getElementById('target-cal-badge').textContent = '—';
      document.getElementById('macro-p').textContent = '—';
      document.getElementById('macro-f').textContent = '—';
      document.getElementById('macro-c').textContent = '—';
    }
    renderProgramSelector(); renderPlanSelector();
    renderDaysTabs(); renderExercises(); renderMeals();
    updateLabels(); updateWaterUI(); prefillCheckin(); renderHistory(); refreshDone();
    updateLiveUI();
  }

  function renderMeals() {
    const c = document.getElementById('meals-container');
    if (!currentPlan || !currentPlan.meals) { c.innerHTML = '<div class="text-xs text-slate-500 text-center py-6">'+esc(t('noMeals'))+'</div>'; return; }
    c.innerHTML = currentPlan.meals.map((meal,mi)=>{
      const items = (meal.foods||meal.items||[]).map(f=>{
        const name = f.name || f.food_name || '?';
        const g = f.grams || f.amount_g || 0;
        const cal = f.calories || Math.round((f.nutrition?.calories||0) * g / 100);
        return `<label class="flex items-center justify-between bg-slate-800/50 px-3 py-2 rounded-xl text-xs cursor-pointer hover:bg-slate-800/80 transition">
          <div class="flex items-center gap-2.5 min-w-0">
            <input type="checkbox" class="nutri-check rounded bg-slate-900 border-slate-600 text-indigo-400 w-4 h-4 cursor-pointer shrink-0" />
            <span class="text-slate-200 truncate">${esc(name)}</span>
          </div>
          <span class="font-mono text-slate-400 shrink-0">${g}г · ${cal} ккал</span>
        </label>`;
      }).join('');
      const mealCal = (meal.foods||meal.items||[]).reduce((s2,f)=>s2+(f.calories||Math.round((f.nutrition?.calories||0)*(f.grams||f.amount_g||0)/100)),0);
      return `<div class="glass rounded-2xl p-4 space-y-2 fade-in">
        <div class="flex justify-between items-center">
          <h4 class="font-display font-bold text-sm text-white">${esc(meal.name||'Приём')}</h4>
          <span class="font-mono text-xs text-slate-400">${mealCal} ккал</span>
        </div>
        <div class="space-y-1.5 pt-1">${items}</div>
      </div>`;
    }).join('');
  }

  /* ============ INIT ============ */
  document.addEventListener('DOMContentLoaded', () => {
    const savedLang = localStorage.getItem('dk_client_lang')||'ru';
    setLang(savedLang);
    loadInitialData();
    initWater();

    // Unlock
    document.getElementById('btn-unlock').addEventListener('click', attemptUnlock);
    document.getElementById('unlock-code-input').addEventListener('keydown', e=>{ if(e.key==='Enter') attemptUnlock(); });
    document.getElementById('unlock-code-input').addEventListener('input', e=>{
      e.target.value = e.target.value.replace(/\D/g,'').slice(0,6);
      document.getElementById('unlock-error').textContent = '';
    });

    // Tabs
    document.querySelectorAll('.nav-tab').forEach(tab=>{
      tab.addEventListener('click',()=>{
        document.querySelectorAll('.nav-tab').forEach(t=>{ t.classList.remove('active','text-indigo-300'); t.classList.add('text-slate-400'); });
        tab.classList.add('active','text-indigo-300'); tab.classList.remove('text-slate-400');
        ['workouts','nutrition','checkin'].forEach(id=>{
          const sec = document.getElementById('tab-'+id);
          if (sec) { sec.classList.toggle('hidden', id!==tab.dataset.tab); if(!sec.classList.contains('hidden')) sec.classList.add('fade-in'); }
        });
      });
    });

    // Quick start / resume
    document.getElementById('btn-quick-start').addEventListener('click', startOrResumeDay);

    // Water
    document.getElementById('btn-water-plus').addEventListener('click',()=>setWater(waterGlasses+1));
    document.getElementById('btn-water-minus').addEventListener('click',()=>setWater(waterGlasses-1));

    // Slider
    document.getElementById('slider-energy').addEventListener('input',e=>{
      document.getElementById('slider-energy-val').textContent = e.target.value+' / 10';
    });

    // Rest timer banner buttons
    document.getElementById('btn-timer-skip').addEventListener('click', stopRest);
    document.getElementById('btn-timer-plus30').addEventListener('click',()=>{ timerSecondsLeft+=30; timerTotal+=30; updateRestDisplay(); });
    document.getElementById('btn-timer-minus15').addEventListener('click',()=>{ timerSecondsLeft=Math.max(0,timerSecondsLeft-15); updateRestDisplay(); });

    // Share
    document.getElementById('btn-share-report').addEventListener('click', ()=>shareReport());

    // Finish workout
    document.getElementById('btn-finish-workout').addEventListener('click', finishWorkout);

    // Check-in
    document.getElementById('btn-save-checkin').addEventListener('click', saveCheckin);

    // Lang
    document.getElementById('lang-select').addEventListener('change',e=>setLang(e.target.value));
  });
  </script>
</body>
</html>
