services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dkg}
      POSTGRES_USER: ${POSTGRES_USER:-dkg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - dkg_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - dkg

  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8080
      HOST: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:-dkg}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dkg}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in deploy/.env}
      INVITE_PEPPER: ${INVITE_PEPPER:?Set INVITE_PEPPER in deploy/.env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL in deploy/.env}
      SESSION_DAYS: ${SESSION_DAYS:-30}
      STORAGE_DIR: /app/data/files
      MAX_FILE_MB: ${MAX_FILE_MB:-25}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-David King Gym <no-reply@localhost>}
    volumes:
      - dkg_files:/app/data/files
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - dkg

volumes:
  dkg_pg:
  dkg_files:

networks:
  dkg:
    driver: bridge
