    async function load() {

        if (cachedData && cachedData.games) state.data = cachedData;

        try {
          var dataRes = await fetch('/arena-data.json?v=6', { cache: 'no-cache' });
          if (!dataRes.ok) throw new Error('data');
          state.data = await dataRes.json();
          try { localStorage.setItem('dk_arena_data_v6', JSON.stringify(state.data)); } catch (_) {}
        } catch (dataError) {
          if (!state.data) throw dataError;
        }
        if (CLIENT_ID) {
          try {
            var recRes = await fetch('/api/portal/' + encodeURIComponent(TOKEN) + '/records?collection=arena_progress', {
              headers: { 'accept': 'application/json', 'x-portal-pin': PIN }
            });
            if (recRes.ok) {
              var payload = await recRes.json();
              var fresh = {};
              (payload.records || []).forEach(function (row) {
                var data = row.data || {};
                var pathId = data.path_id || String(row.id || '').split('::')[1];
                if (pathId) fresh[pathId] = data;
              });
              state.records = fresh;
              try { localStorage.setItem('dk_arena_records_' + CLIENT_ID, JSON.stringify(state.records)); } catch (_) {}
            }
          } catch (_) { /* offline: keep the last cached progress */ }
        }
        state.loading = false;
        state.error = '';
        render();
      } catch (error) {
        state.loading = false;
        state.error = t('error');

      }

    }

      }).join('') + '</details>' : '';
      return '<div class="exam"><div class="exam-head"><b>' + esc(t('exam')) + '</b><small>' + esc(t('retake')) + '</small></div>' + (tier.exam && tier.exam.intro ? '<p class="exam-intro">' + esc(tr(tier.exam.intro)) + '</p>' : '') + fields +
        '<label style="display:block;margin-top:8px;color:var(--muted);font-size:9.5px">' + esc(t('videoOptional')) + '<input type="url" data-a-input="video:url" placeholder="https://..." value="' + (last && last.video ? esc(last.video) : '') + '" /></label>' +
        '<button type="button" class="cta" data-a="submit-exam" data-path="' + esc(state.pathId) + '" data-tier="' + esc(tier.id) + '">' + esc(t('submitExam')) + '</button>' + lastHtml + history + '</div>';
    }

    function shareTrophy(pathId, tierId) {
      var rec = state.records[pathId];
      var trophy = rec && (rec.trophies || []).filter(function (t) { return t.tier_id === tierId; })[0];
      if (!trophy) return;
      var text = tr(trophy.name) + ' — David King Gym Arena · ' + fmtDate(trophy.earned_at);
      if (navigator.share) {
        navigator.share({ title: 'David King Gym Arena', text: text }).catch(function () {});
      } else if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { toast(t('copied'), 'ok'); }).catch(function () {});
      } else {
        toast(text, 'ok');
      }
    }

    function bindCommon() {
      langSel.value = state.lang;
      var back = app.querySelector('[data-a="back"]');
      if (back) back.addEventListener('click', function () { state.view = 'games'; state.pathId = null; state.flash = null; render(); });
      var close = app.querySelector('[data-a="close-flash"]');
      if (close) close.addEventListener('click', function () { state.flash = null; render(); });
      app.querySelectorAll('[data-a="share-trophy"]').forEach(function (btn) {
        btn.addEventListener('click', function () { shareTrophy(btn.getAttribute('data-path'), btn.getAttribute('data-tier')); });
      });
    }
    function bindGames() {
      app.querySelectorAll('[data-a="open-path"]').forEach(function (b) {
        b.addEventListener('click', function () { state.pathId = b.getAttribute('data-path'); state.view = 'path'; state.flash = null; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
      });
    }
    function bindPath() {
      app.querySelectorAll('[data-a="toggle-lesson"]').forEach(function (box) {
        box.addEventListener('change', async function () {
          var key = box.getAttribute('data-key');
          var rec = recordFor(state.pathId);
          var pos = (rec.completed_lessons || []).indexOf(key);
          if (pos === -1) rec.completed_lessons = (rec.completed_lessons || []).concat(key);
          else rec.completed_lessons = rec.completed_lessons.filter(function (k) { return k !== key; });
          try { await saveRecord(rec); render(); } catch (e) { toast(t('saveFailed'), 'bad'); }
        });
      });
      var submit = app.querySelector('[data-a="submit-exam"]');
      if (submit) submit.addEventListener('click', function () { submitExam(submit); });
    }

    async function submitExam(button) {
      var pathId = button.getAttribute('data-path');
      var tierId = button.getAttribute('data-tier');
      var found = findPath(pathId);
      if (!found) return;
      var tier = (found.path.tiers || []).filter(function (t) { return t.id === tierId; })[0];
      if (!tier) return;
      var panel = button.closest('.exam') || document;
      var stations = (tier.exam && tier.exam.stations) || [];
      var missing = false;
      stations.forEach(function (s) {
        if (s.type === 'reps' || s.type === 'hold') {
          var sets = Math.max(1, Number(s.sets) || 1);
          for (var i = 0; i < sets; i++) { var el = panel.querySelector('[data-a-input="' + s.id + ':' + i + '"]'); if (!el || String(el.value).trim() === '') missing = true; }
        } else if (s.type === 'time') {
          var tEl = panel.querySelector('[data-a-input="' + s.id + ':time"]');
          if (!tEl || parseTime(tEl.value) <= 0) missing = true;
        } else if (s.type === 'distance') {
          var dEl = panel.querySelector('[data-a-input="' + s.id + ':distance"]');
          if (!dEl || String(dEl.value).trim() === '') missing = true;
        } else if (s.type === 'load_bw') {
          var w = panel.querySelector('[data-a-input="' + s.id + ':weight"]');
          var bw = panel.querySelector('[data-a-input="' + s.id + ':bodyweight"]');
          if (!w || !bw || String(w.value).trim() === '' || String(bw.value).trim() === '') missing = true;
        }
      });
      if (missing) { toast(t('fillStations'), 'bad'); return; }
      var rec = recordFor(pathId);
      var results = [];
      var bodyweight = 0;
      stations.forEach(function (s) {
        var display = '', passed = false, values = null;
        if (s.type === 'reps' || s.type === 'hold') {
          var sets = Math.max(1, Number(s.sets) || 1);
          var vals = [];
          for (var i = 0; i < sets; i++) { var el = panel.querySelector('[data-a-input="' + s.id + ':' + i + '"]'); vals.push(num(el ? el.value : 0)); }
          values = vals;
          passed = vals.every(function (v) { return v >= Number(s.target || 0); });
          display = vals.join(' / ') + (s.type === 'hold' ? ' ' + t('seconds') : ' ' + t('reps'));
        } else if (s.type === 'time') {
          var tInput = panel.querySelector('[data-a-input="' + s.id + ':time"]');
          var seconds = parseTime(tInput ? tInput.value : 0);
          values = seconds;
          passed = seconds > 0 && seconds <= Number(s.target || 0);
          display = fmtPerfTime(seconds);
        } else if (s.type === 'distance') {
          var dInput = panel.querySelector('[data-a-input="' + s.id + ':distance"]');
          var meters = num(dInput ? dInput.value : 0);
          values = meters;
          passed = meters >= Number(s.target || 0);
          display = meters + ' ' + (s.unit === 'cm' ? t('cmShort') : t('metersShort'));
        } else if (s.type === 'load_bw') {
          var w = panel.querySelector('[data-a-input="' + s.id + ':weight"]');
          var bw = panel.querySelector('[data-a-input="' + s.id + ':bodyweight"]');
          var weight = num(w ? w.value : 0);
          bodyweight = num(bw ? bw.value : 0);
          values = { weight: weight, bodyweight: bodyweight };
          var ratio = bodyweight > 0 ? weight / bodyweight : 0;
          passed = ratio >= Number(s.target || 0);
          display = weight + ' kg / ' + bodyweight + ' kg = ' + ratio.toFixed(2) + '×';
        } else if (s.type === 'manual') {
          var chk = panel.querySelector('[data-a-input="' + s.id + ':manual"]');
          passed = !!(chk && chk.checked);
          values = { checked: passed };
          display = passed ? t('passed') : t('failed');
        }
        results.push({ station_id: s.id, label: tr(s.name), display: display, passed: passed, values: values });
      });
      var passedAll = results.length > 0 && results.every(function (r) { return r.passed; });
      var videoEl = panel.querySelector('[data-a-input="video:url"]');
      var video = videoEl ? String(videoEl.value || '').trim() : '';
      var attempt = { id: 'att_' + Date.now(), at: Date.now(), passed: passedAll, results: results, video: video, source: 'portal' };
      rec.exam_attempts = (rec.exam_attempts || []).concat(attempt).slice(-20);
      if (bodyweight) rec.bodyweight = bodyweight;
      if (passedAll) {
        var existing = (rec.trophies || []).some(function (t) { return t.tier_id === tier.id; });
        if (!existing) {
          var snapshot = { id: tier.trophy.id, tier_id: tier.id, tier: tier.tier, path_id: pathId, game_id: found.game.id, name: tier.trophy.name, description: tier.trophy.description, earned_at: Date.now(), results: results, video: video, attempt_id: attempt.id, source: 'portal' };
          rec.trophies = (rec.trophies || []).concat(snapshot);
          rec.current_tier = Math.max(Number(rec.current_tier || 0), (found.path.tiers || []).findIndex(function (t) { return t.id === tier.id; }) + 1);
          state.flash = { trophy: snapshot };
        }
      }
      try {
        await saveRecord(rec);
        toast(passedAll ? t('examPassed') : t('examFailed'), passedAll ? 'ok' : 'bad');
        render();
        if (!passedAll) {
          var lastPanel = app.querySelector('.attempt.fail');
          if (lastPanel && lastPanel.scrollIntoView) lastPanel.scrollIntoView({ behavior: 'smooth', block: 'center' });
        } else {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      } catch (e) {
        console.error('[arena] exam save failed', e);
        toast(t('saveFailed'), 'bad');
      }
    }

    function setLang(l) {
      state.lang = ['ru', 'en', 'he'].indexOf(l) !== -1 ? l : 'ru';
      try { localStorage.setItem('dk_client_lang', state.lang); } catch (_) {}
      document.documentElement.lang = state.lang;
      document.documentElement.dir = state.lang === 'he' ? 'rtl' : 'ltr';
      render();
    }

    try { state.lang = ['ru', 'en', 'he'].indexOf(localStorage.getItem('dk_client_lang')) !== -1 ? localStorage.getItem('dk_client_lang') : 'ru'; } catch (_) {}
    try { if (BOOT.weight) state.clientWeight = BOOT.weight; } catch (_) {}
    document.documentElement.lang = state.lang;
    document.documentElement.dir = state.lang === 'he' ? 'rtl' : 'ltr';
    langSel.value = state.lang;
    langSel.addEventListener('change', function () { setLang(langSel.value); });
    try {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/p/__DKG_PORTAL_TOKEN__/sw.js', { scope: '/p/__DKG_PORTAL_TOKEN__' }).catch(function () {});
      }
    } catch (_) {}
    load();
  })();
  </script>
</body>
</html>
